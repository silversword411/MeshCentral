name: Code Quality Check

on:
  pull_request:
    branches: [ main, master, develop ]
    paths:
      - '**.js'
      - '**.json'
      - '.eslintrc*'
      - '.prettierrc*'
      - 'package*.json'
  push:
    branches: [ main, master, develop ]
    paths:
      - '**.js'
      - '**.json'

jobs:
  code-quality:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [16.x, 18.x, 20.x]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      run: |
        npm ci
        npm install --save-dev eslint prettier eslint-config-prettier eslint-plugin-prettier

    - name: Run ESLint
      run: |
        npx eslint "**/*.js" --max-warnings 0

    - name: Check Prettier formatting
      run: |
        npx prettier --check "**/*.js" "**/*.json" --ignore-path .prettierignore

    - name: Run security audit
      run: |
        npm audit --audit-level=moderate

  lint-comment:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    needs: code-quality

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18.x'
        cache: 'npm'

    - name: Install dependencies
      run: |
        npm ci
        npm install --save-dev eslint prettier eslint-config-prettier eslint-plugin-prettier

    - name: Run ESLint with output
      id: eslint
      run: |
        npx eslint "**/*.js" --format json --output-file eslint-report.json || true

    - name: Comment PR with lint results
      uses: actions/github-script@v7
      if: always()
      with:
        script: |
          const fs = require('fs');

          let eslintReport = '';
          try {
            const report = JSON.parse(fs.readFileSync('eslint-report.json', 'utf8'));
            const errorCount = report.reduce((sum, file) => sum + file.errorCount, 0);
            const warningCount = report.reduce((sum, file) => sum + file.warningCount, 0);

            if (errorCount > 0 || warningCount > 0) {
              eslintReport = `## 🔍 Code Quality Report\n\n`;
              eslintReport += `- **Errors:** ${errorCount}\n`;
              eslintReport += `- **Warnings:** ${warningCount}\n\n`;

              if (errorCount > 0) {
                eslintReport += `❌ **This PR has ESLint errors that must be fixed before merging.**\n\n`;
              }

              const filesWithIssues = report.filter(file => file.errorCount > 0 || file.warningCount > 0);
              if (filesWithIssues.length > 0) {
                eslintReport += `### Files with issues:\n\n`;
                filesWithIssues.forEach(file => {
                  eslintReport += `**${file.filePath}**\n`;
                  file.messages.forEach(msg => {
                    const type = msg.severity === 2 ? '❌' : '⚠️';
                    eslintReport += `- ${type} Line ${msg.line}: ${msg.message} (${msg.ruleId})\n`;
                  });
                  eslintReport += `\n`;
                });
              }
            } else {
              eslintReport = `## ✅ Code Quality Report\n\nAll checks passed! Great work! 🎉\n`;
            }
          } catch (error) {
            eslintReport = `## ⚠️ Code Quality Report\n\nUnable to generate report: ${error.message}\n`;
          }

          // Find existing comment
          const { data: comments } = await github.rest.issues.listComments({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
          });

          const existingComment = comments.find(comment =>
            comment.user.type === 'Bot' && comment.body.includes('Code Quality Report')
          );

          if (existingComment) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: existingComment.id,
              body: eslintReport
            });
          } else {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: eslintReport
            });
          }
